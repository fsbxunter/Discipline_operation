<!DOCTYPE html>
<html>
<head>
    <title>PDF Reader (FastAPI)</title>
    <meta charset="utf-8">
</head>
<body>
    <h1>📄 PDF Reader</h1>
    <form method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".pdf" required>
        <button type="submit">Открыть PDF</button>
    </form>

    {% if text %}
    <div style="margin-top: 20px;">
        <h2>Текст из PDF:</h2>
        <textarea style="width: 100%; height: 500px; font-family: monospace;">{{ text }}</textarea>
    </div>
    {% endif %}
</body>
</html>
